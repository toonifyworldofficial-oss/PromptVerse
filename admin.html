<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PromptVerse Admin</title><style>body{background:#111827;color:#eee;font:16px system-ui;max-width:800px;margin:24px auto;padding:15px}section{background:#1e293b;padding:18px;border-radius:12px;margin:12px 0}input,textarea,select,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;background:#0f172a;color:white;border:1px solid #475569}button{background:#7658ff;border:0;font-weight:bold}textarea{min-height:100px}.hidden{display:none}.item{border:1px solid #475569;padding:12px;margin:8px 0;border-radius:8px}</style></head><body><h1>PromptVerse Admin</h1><section><h2>Connection</h2><input id="url" placeholder="Supabase Project URL"><input id="key" placeholder="Publishable key (sb_publishable_...)"><button onclick="connect()">Save connection</button><p id="msg">Use only the public publishable/anon key, never a secret/service_role key.</p></section><section><h2>Admin login</h2><input id="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Sign in</button><button onclick="logout()">Sign out</button></section><section id="editor" class="hidden"><h2>Add / edit prompt</h2><input id="id" type="hidden"><input id="title" placeholder="Title"><select id="cat"><option>Images</option><option>Videos</option></select><select id="status"><option value="draft">Draft</option><option value="published">Publish</option></select><textarea id="main" placeholder="Main prompt"></textarea><textarea id="negative" placeholder="Negative prompt"></textarea><input id="tags" placeholder="Tags, comma separated"><input id="file" type="file" accept="image/*,video/*"><button onclick="save()">Save</button><button onclick="clearForm()">Clear</button><p id="saveMsg"></p></section><section id="library" class="hidden"><h2>Content library</h2><button onclick="load()">Refresh</button><div id="items"></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let db,usr;function connect(){let u=url.value.trim(),k=key.value.trim();if(!u||!k){msg.textContent='Enter URL and publishable key';return}db=supabase.createClient(u,k);localStorage.setItem('pvurl',u);localStorage.setItem('pvkey',k);msg.textContent='Connection saved. Sign in.'}url.value=localStorage.getItem('pvurl')||'';key.value=localStorage.getItem('pvkey')||'';async function login(){if(!db)connect();if(!db)return;let r=await db.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error){msg.textContent=r.error.message;return}usr=r.data.user;editor.classList.remove('hidden');library.classList.remove('hidden');msg.textContent='Signed in';load()}async function logout(){if(db)await db.auth.signOut();usr=null;editor.classList.add('hidden');library.classList.add('hidden');msg.textContent='Signed out'}function clearForm(){id.value='';title.value='';main.value='';negative.value='';tags.value='';file.value='';status.value='draft'}function edit(p){id.value=p.id;title.value=p.title;cat.value=p.category;status.value=p.status;main.value=p.main_prompt;negative.value=p.negative_prompt||'';tags.value=(p.tags||[]).join(', ')}async function save(){if(!db||!usr){saveMsg.textContent='Sign in first';return}let asset_url=null,asset_path=null,f=file.files[0];if(f){asset_path=usr.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_');let up=await db.storage.from('prompt-assets').upload(asset_path,f);if(up.error){saveMsg.textContent=up.error.message;return}asset_url=db.storage.from('prompt-assets').getPublicUrl(asset_path).data.publicUrl}let p={title:title.value.trim(),category:cat.value,status:status.value,main_prompt:main.value.trim(),negative_prompt:negative.value.trim(),tags:tags.value.split(',').map(x=>x.trim()).filter(Boolean),updated_at:new Date().toISOString()};if(!p.title||!p.main_prompt){saveMsg.textContent='Title and main prompt required';return}if(asset_url){p.asset_url=asset_url;p.asset_path=asset_path}let r=id.value?await db.from('prompts').update(p).eq('id',id.value):await db.from('prompts').insert(p);if(r.error){saveMsg.textContent=r.error.message;return}saveMsg.textContent='Saved';clearForm();load()}async function load(){let r=await db.from('prompts').select('*').order('created_at',{ascending:false});if(r.error){items.textContent=r.error.message;return}items.innerHTML='';r.data.forEach(p=>{let d=document.createElement('div');d.className='item';let t=document.createElement('b');t.textContent=p.title+' — '+p.category+' — '+p.status;let e=document.createElement('button');e.textContent='Edit';e.onclick=()=>edit(p);let x=document.createElement('button');x.textContent='Delete';x.onclick=async()=>{if(confirm('Delete this record?')){let z=await db.from('prompts').delete().eq('id',p.id);if(z.error)alert(z.error.message);else load()}};d.append(t,e,x);items.append(d)})}</script></body></html>
